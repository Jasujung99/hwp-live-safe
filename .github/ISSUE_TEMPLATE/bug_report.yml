name: Bug report
description: Report a reproducible HWP Live Safe defect without private data.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not attach a real document, profile, token, personal window title, or unredacted log. Use private vulnerability reporting for security-sensitive behavior.
  - type: input
    id: version
    attributes:
      label: HWP Live Safe version
      placeholder: 0.3.0rc1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Redacted Windows, Hancom, Python, and MCP-client versions.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Native safe mode with a new unsaved document
        - Experimental foreground typing
        - Fake backend or automated test
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Minimal non-sensitive reproduction
      description: Use dummy text and a disposable document only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed documents, profile values, tokens, machine-specific paths, and personal data.
          required: true
        - label: I checked KNOWN_LIMITATIONS.md and this is not already documented behavior.
          required: true
